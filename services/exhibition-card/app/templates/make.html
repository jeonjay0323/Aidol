{% extends "_site.html" %}
{% block title %}아이돌 제작 · LUKIDS{% endblock %}
{% block css %}<link rel="stylesheet" href="/static/scan.css?v=chat-2">{% endblock %}
{% block head %}
<style>
  /* 만들기 흐름만 가운데에 폰 너비로. 왼쪽 설명 · 단계 목록은 뺐다 —
     이전 단계로는 각 화면 위의 뒤로 버튼으로 돌아간다 */
  .make .wrap{max-width:420px;width:100%;margin:0 auto;padding:0 0 40px}
  .make .screen{padding-top:28px}
  @media (max-width:640px){ .make .screen{padding-top:8px} }
</style>
{% endblock %}

{% block body %}
<svg class="sr" aria-hidden="true" focusable="false"><defs>
  <g id="g-plus" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
  <g id="g-chevron" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></g>
</defs></svg>

<main class="site-main">
  <div class="make">
    <div class="wrap">
      {% include "_create_screens.html" %}
    </div>
  </div>
</main>
{% endblock %}

{% block script %}
<script>
  function go(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    document.getElementById(id).classList.add('on');
    window.scrollTo(0, 0);
  }
  function pick(btn){
    btn.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
    btn.classList.add('sel');
  }
  const CREATE_HOME = () => { location.href = document.body.classList.contains('demo') ? '/demo' : '/'; };
</script>
<script src="/static/ring.js?v=demo-1"></script>
<script src="/static/create.js?v=share-1"></script>
<script>
  // 제작 페이지는 B — 프롬프트 · 이름 · 목소리까지 고르고 바로 사진 만들기(성격 칸 없음).
  // 연구 조건을 시험할 때만 ?depth=A|B|C 로 바꾼다.
  // 전시장 카드 화면(/c/…)의 만들기는 지금처럼 서버가 조건을 배정한다.
  const q = new URLSearchParams(location.search).get('depth');
  CREATE.depth = ['A', 'B', 'C'].includes(q) ? q : 'B';
  startCreate();
</script>
{% endblock %}
